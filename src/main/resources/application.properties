spring.application.name=LP2_T2_Hermoza_Jose

# Server configuration
# If server.port is not specified, Spring Boot uses port 8080 by default.
server.port=8081

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate

# MySQL database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/database_t2?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql

# Locale configuration
spring.web.locale=es_PE
spring.web.locale-resolver=fixed